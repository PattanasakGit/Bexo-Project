name: Keep Supabase Awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bexo health endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "Set repository secret KEEPALIVE_URL to https://your-domain.com/api/health"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 20 "$KEEPALIVE_URL"
